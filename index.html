<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tagwerk</title>
<style>
  :root {
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242422;
    --border: #383835;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --accent: #3987e5;
    --accent-soft: rgba(57,135,229,.16);
    --good: #0ca30c;
    --critical: #e66767;
    --grid: #2c2c2a;
    --radius: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-top: var(--safe-t);
    padding-bottom: calc(76px + var(--safe-b));
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 24px; }
  h1 { font-size: 28px; font-weight: 700; margin: 8px 0 2px; letter-spacing: -.02em; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 10px; }
  .sub { color: var(--text-2); margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--text-3); }
  .muted { color: var(--text-3); }
  .small { font-size: 13px; }
  input, select, button { font: inherit; font-size: 16px; color: var(--text); }
  input, select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none;
  }
  input[type="date"], input[type="time"] { min-height: 44px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  label.f { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px;
    font-weight: 600; cursor: pointer; white-space: nowrap; min-height: 44px;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.small { padding: 6px 12px; min-height: 34px; font-size: 14px; }
  .icon-btn { background: none; border: 0; color: var(--text-3); padding: 8px; cursor: pointer; font-size: 18px; line-height: 1; min-width: 36px; min-height: 36px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .seg button { background: none; border: 0; padding: 5px 12px; border-radius: 8px; color: var(--text-2); font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  /* Todos */
  .todo { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .todo:first-child { border-top: 0; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-3); background: none; flex: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check.done::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .todo .t { flex: 1; min-width: 0; word-wrap: break-word; }
  .todo.isdone .t { color: var(--text-3); text-decoration: line-through; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
  .due { font-size: 12px; color: var(--text-3); }
  .due.late { color: var(--critical); }
  .group-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 4px 0 2px; }
  .empty { color: var(--text-3); padding: 6px 0; }

  /* Charts */
  .chart { position: relative; width: 100%; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -100%);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; z-index: 5;
  }
  .tip b { font-variant-numeric: tabular-nums; }

  /* Entry lists */
  .entry { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .entry:first-child { border-top: 0; }

  /* Quality picker */
  .q { display: flex; gap: 6px; }
  .q button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-size: 16px; cursor: pointer; }
  .q button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(26,26,25,.92);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around;
    padding: 6px 4px calc(6px + var(--safe-b)); z-index: 10;
  }
  nav.tabs button { background: none; border: 0; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 4px 6px; min-width: 60px; cursor: pointer; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button.on { color: var(--accent); }

  .soon { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
  .soon:first-of-type { border-top: 0; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .dash-link { cursor: pointer; }
  .toast { max-width: 90vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 99px; font-size: 14px; display: none; z-index: 20; }
  [hidden] { display: none !important; }
  textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 70px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .macro { margin-top: 12px; }
  .macro .row { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .kcal-big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .step { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; }
  .step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 10px; }
  .meal-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 10px 0 0; display: flex; justify-content: space-between; }
  .meal-title:first-child { margin-top: 0; }
  .fav { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .fav:first-of-type { border-top: 0; }
  .datebar { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
  .datebar b { font-size: 20px; }
  .ok-box { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<main id="view"></main>
<div class="toast" id="toast"></div>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Übersicht</button>
  <button data-tab="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/><path d="M10 6.5h10M10 12h10M10 17.5h10"/></svg>Todos</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></svg>Essen</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Körper</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Mehr</button>
</nav>

<script>
"use strict";
/* ---------- Speicher ---------- */
const KEY = "tagwerk_v1";
const blank = () => ({ todos: [], weights: [], sleep: [], meals: [], favorites: [],
  settings: { goalWeight: null, sleepGoal: 8, kcalGoal: null, proteinGoal: null, carbGoal: null, fatGoal: null, aiApp: "chatgpt" } });
let db = load();
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && typeof d === "object") return Object.assign(blank(), d, { settings: Object.assign(blank().settings, d.settings || {}) });
  } catch (e) {}
  return blank();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Speichern fehlgeschlagen"); }
}

/* ---------- Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const short = s => { const d = parse(s); return `${d.getDate()}. ${MONTHS[d.getMonth()]}`; };
const fmt = (n, dig = 1) => n == null || isNaN(n) ? "–" : n.toLocaleString("de-DE", { minimumFractionDigits: dig, maximumFractionDigits: dig });
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const hm = h => { const t = Math.round(h * 60); return `${Math.floor(t / 60)} h ${pad(t % 60)} min`; };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 1800); }
function relDay(s) {
  const d = dayDiff(today(), s);
  if (d === 0) return "heute"; if (d === 1) return "morgen"; if (d === -1) return "gestern";
  if (d < 0) return `seit ${-d} Tagen`; if (d < 7) return WD[parse(s).getDay()] + ", " + short(s);
  return short(s);
}

/* ---------- Berechnungen ---------- */
const weightsSorted = () => [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
// 7-Tage-Durchschnitt: Mittel aller Einträge der letzten 7 Tage bis einschließlich Datum
function avg7(list, date) {
  const from = addDays(date, -6);
  const w = list.filter(e => e.date >= from && e.date <= date);
  return w.length ? w.reduce((s, e) => s + e.kg, 0) / w.length : null;
}
function weightStats() {
  const l = weightsSorted();
  if (!l.length) return null;
  const last = l[l.length - 1];
  const a = avg7(l, last.date);
  const prevDate = addDays(last.date, -7);
  const prev = l.filter(e => e.date <= prevDate).length ? avg7(l, prevDate) : null;
  return { last, avg: a, perWeek: prev != null ? a - prev : null };
}
function sleepHours(e) {
  const [bh, bm] = e.bed.split(":").map(Number), [wh, wm] = e.wake.split(":").map(Number);
  let m = (wh * 60 + wm) - (bh * 60 + bm); if (m <= 0) m += 1440; return m / 60;
}
const sleepSorted = () => [...db.sleep].sort((a, b) => a.date.localeCompare(b.date));
function sleepAvg(days) {
  const from = addDays(today(), -(days - 1));
  const l = db.sleep.filter(e => e.date >= from);
  return l.length ? l.reduce((s, e) => s + sleepHours(e), 0) / l.length : null;
}

/* ---------- Navigation ---------- */
let tab = "home", lastBody = "weight";
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab === "body" ? lastBody : b.dataset.tab);
});
function go(t) { if (t === "food" && tab !== "food") { fDate = null; fLastSaved = null; } tab = t; if (t === "weight" || t === "sleep") lastBody = t; render(); window.scrollTo(0, 0); }
function render() {
  const navKey = tab === "weight" || tab === "sleep" ? "body" : tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === navKey));
  ({ home: renderHome, todos: renderTodos, food: renderFood, weight: renderWeight, sleep: renderSleep, more: renderMore })[tab]();
}
function bodyHeader(active) {
  return `<div class="row" style="margin:8px 0 18px"><div class="seg grow" id="bodySeg" style="display:flex">
    <button class="grow ${active === "weight" ? "on" : ""}" data-b="weight" style="padding:8px">Gewicht</button>
    <button class="grow ${active === "sleep" ? "on" : ""}" data-b="sleep" style="padding:8px">Schlaf</button></div></div>`;
}
function bindBodyHeader() {
  $("#bodySeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(b.dataset.b); });
}

/* ---------- Übersicht ---------- */
function renderHome() {
  const h = new Date().getHours();
  const hi = h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend";
  const d = new Date();
  const open = db.todos.filter(t => !t.done && t.due && t.due <= today()).sort((a, b) => a.due.localeCompare(b.due));
  const ws = weightStats();
  const lastSleep = sleepSorted().slice(-1)[0];
  const s7 = sleepAvg(7);
  const upcoming = db.todos.filter(t => !t.done && t.due && t.due > today()).length;
  $("#view").innerHTML = `
    <h1>${hi}</h1>
    <p class="sub">${["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][d.getDay()]}, ${d.getDate()}. ${["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][d.getMonth()]}</p>

    <div class="card">
      <div class="row"><h2 class="grow">Heute zu erledigen</h2><button class="btn small ghost" data-go="todos">Alle</button></div>
      ${open.length ? open.map(todoRow).join("") : `<div class="empty">Nichts fällig. ${upcoming ? `${upcoming} Aufgabe${upcoming > 1 ? "n" : ""} demnächst.` : ""}</div>`}
    </div>

    <div class="card dash-link" data-go="food">
      <h2>Ernährung heute</h2>
      ${nutritionSummary(today(), true)}
    </div>

    <div class="card dash-link" data-go="weight">
      <h2>Gewicht</h2>
      ${ws ? `
        <div class="stats">
          <div class="stat"><div class="v">${fmt(ws.last.kg)}</div><div class="l">zuletzt (kg)</div></div>
          <div class="stat"><div class="v">${fmt(ws.avg)}</div><div class="l">Ø 7 Tage</div></div>
          <div class="stat"><div class="v">${ws.perWeek == null ? "–" : (ws.perWeek > 0 ? "+" : "") + fmt(ws.perWeek)}</div><div class="l">pro Woche</div></div>
        </div>
        <div class="chart" id="dashW" style="margin-top:12px"></div>`
      : `<div class="empty">Noch keine Einträge. Tippe hier, um dein Gewicht einzutragen.</div>`}
    </div>

    <div class="card dash-link" data-go="sleep">
      <h2>Schlaf</h2>
      ${lastSleep ? `
        <div class="stats">
          <div class="stat"><div class="v">${hm(sleepHours(lastSleep)).replace(" min", "")}</div><div class="l">${lastSleep.date === today() ? "letzte Nacht" : "zuletzt, " + short(lastSleep.date)}</div></div>
          <div class="stat"><div class="v">${s7 == null ? "–" : fmt(s7)} h</div><div class="l">Ø 7 Tage</div></div>
          <div class="stat"><div class="v">${lastSleep.quality ? lastSleep.quality + "/5" : "–"}</div><div class="l">Gefühl</div></div>
        </div>`
      : `<div class="empty">Noch keine Einträge. Tippe hier, um deinen Schlaf einzutragen.</div>`}
    </div>

    <div class="card">
      <h2>Kommt bald</h2>
      <div class="small muted">Schule mit Datei-KI (Phase 3), Gym-Tracking (Phase 4).</div>
    </div>`;
  bindTodoEvents();
  $("#view").querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest(".check")) return; go(el.dataset.go);
  }));
  if (ws) weightChart($("#dashW"), weightsSorted().filter(e => e.date >= addDays(today(), -29)), { mini: true });
}

/* ---------- Todos ---------- */
const CATS = ["Schule", "Gym", "Ernährung", "Sonstiges"];
function todoRow(t) {
  const late = t.due && t.due < today() && !t.done;
  return `<div class="todo ${t.done ? "isdone" : ""}" data-id="${t.id}">
    <button class="check ${t.done ? "done" : ""}" aria-label="Erledigt"></button>
    <div class="t">${esc(t.text)}<div class="row" style="gap:6px;margin-top:2px">
      ${t.cat ? `<span class="tag">${esc(t.cat)}</span>` : ""}
      ${t.due ? `<span class="due ${late ? "late" : ""}">${relDay(t.due)}</span>` : ""}
    </div></div>
    ${tab === "todos" ? `<button class="icon-btn del" aria-label="Löschen">✕</button>` : ""}
  </div>`;
}
function bindTodoEvents() {
  $("#view").querySelectorAll(".todo").forEach(row => {
    const t = db.todos.find(x => x.id === row.dataset.id);
    row.querySelector(".check").addEventListener("click", e => {
      e.stopPropagation(); t.done = !t.done; t.doneAt = t.done ? today() : null; save(); render();
    });
    const del = row.querySelector(".del");
    if (del) del.addEventListener("click", () => {
      if (confirm("Aufgabe löschen?")) { db.todos = db.todos.filter(x => x.id !== t.id); save(); render(); }
    });
  });
}
let showDone = false;
function renderTodos() {
  const open = db.todos.filter(t => !t.done);
  const td = today();
  const groups = [
    ["Überfällig", open.filter(t => t.due && t.due < td)],
    ["Heute", open.filter(t => t.due === td)],
    ["Demnächst", open.filter(t => t.due && t.due > td)],
    ["Ohne Datum", open.filter(t => !t.due)],
  ];
  groups.forEach(g => g[1].sort((a, b) => (a.due || "").localeCompare(b.due || "")));
  const done = db.todos.filter(t => t.done).sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""));
  $("#view").innerHTML = `
    <h1>Todos</h1><p class="sub">${open.length} offen</p>
    <form class="card" id="todoForm">
      <input id="tText" placeholder="Neue Aufgabe …" autocomplete="off" required>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f">Fällig</label><input type="date" id="tDue" value="${td}"></div>
        <div class="grow"><label class="f">Bereich</label><select id="tCat">${CATS.map(c => `<option>${c}</option>`).join("")}</select></div>
      </div>

/* ---------- Diagramm-Grundlagen ---------- */
function niceTicks(min, max, count) {
  const span = max - min || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
function attachTip(box, svg, pts, xs, html, onMove) {
  let tip = box.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
  const cross = svg.querySelector(".cross");
  const show = ev => {
    const r = svg.getBoundingClientRect(), scale = r.width / svg.viewBox.baseVal.width;
    const p = ev.touches ? ev.touches[0] : ev;
    const x = (p.clientX - r.left) / scale;
    let best = 0, bd = Infinity;
    xs.forEach((v, i) => { const d = Math.abs(v - x); if (d < bd) { bd = d; best = i; } });
    const pt = pts[best];
    tip.innerHTML = html(best); tip.style.display = "block";
    const left = Math.min(Math.max(pt.x * scale, 70), r.width - 70);
    tip.style.left = left + "px"; tip.style.top = (pt.y * scale - 10) + "px";
    if (cross) { cross.setAttribute("x1", pt.x); cross.setAttribute("x2", pt.x); cross.style.display = ""; }
    if (onMove) onMove(best);
  };
  const hide = () => { tip.style.display = "none"; if (cross) cross.style.display = "none"; if (onMove) onMove(-1); };
  svg.addEventListener("mousemove", show); svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", show, { passive: true }); svg.addEventListener("touchmove", show, { passive: true });
  svg.addEventListener("touchend", () => setTimeout(hide, 1500));
}

function weightChart(box, list, opt = {}) {
  if (!box) return;
  const all = weightsSorted();
  const W = Math.max(280, box.clientWidth || 320), H = opt.mini ? 110 : 240;
  const m = { l: 40, r: 12, t: 12, b: opt.mini ? 8 : 26 };
  if (!list.length) { box.innerHTML = `<div class="empty">Noch keine Daten in diesem Zeitraum.</div>`; return; }
  const avgs = list.map(e => avg7(all, e.date));
  const goal = db.settings.goalWeight;
  let lo = Math.min(...list.map(e => e.kg)), hi = Math.max(...list.map(e => e.kg));
  if (goal && !opt.mini) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if (hi - lo < 2) { const c = (hi + lo) / 2; lo = c - 1; hi = c + 1; }
  const ticks = niceTicks(lo, hi, opt.mini ? 2 : 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const d0 = list[0].date, dn = Math.max(1, dayDiff(d0, list[list.length - 1].date));
  const X = d => m.l + (dayDiff(d0, d) / dn) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const xs = list.map(e => list.length === 1 ? (m.l + W - m.r) / 2 : X(e.date));
  const avgPath = avgs.map((a, i) => `${i ? "L" : "M"}${xs[i].toFixed(1)} ${Y(a).toFixed(1)}`).join("");
  // x-Achsen-Beschriftung: bis zu 4 Datumswerte
  let xl = "";
  if (!opt.mini) {
    const n = Math.min(4, list.length), idx = [...new Set(Array.from({ length: n }, (_, i) => Math.round(i * (list.length - 1) / Math.max(1, n - 1))))];
    xl = idx.map((i, k) => `<text x="${xs[i]}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="${k === 0 && idx.length > 1 ? "start" : k === idx.length - 1 && idx.length > 1 ? "end" : "middle"}">${short(list[i].date)}</text>`).join("");
  }
  box.innerHTML = `${opt.mini ? "" : `<div class="legend">
      <span><i style="width:8px;height:8px;border-radius:50%;background:var(--text-3)"></i>Tageswert</span>
      <span><i style="width:16px;height:2px;background:var(--accent)"></i>Ø 7 Tage</span>
      ${goal ? `<span><i style="width:16px;border-top:2px dashed var(--good)"></i>Ziel ${fmt(goal)} kg</span>` : ""}
    </div>`}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/>
        <text x="${m.l - 8}" y="${Y(t) + 4}" font-size="11" fill="var(--text-3)" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join("")}
      ${goal && !opt.mini ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>` : ""}
      <line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" stroke-width="1" style="display:none"/>
      ${list.map((e, i) => `<circle cx="${xs[i]}" cy="${Y(e.kg)}" r="${opt.mini ? 2.5 : 4}" fill="var(--text-3)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      <path d="${avgPath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xl}
    </svg>`;
  if (!opt.mini) {
    const svg = box.querySelector("svg");
    attachTip(box, svg, list.map((e, i) => ({ x: xs[i], y: Math.min(Y(e.kg), Y(avgs[i])) })), xs,
      i => `${short(list[i].date)}<br><b>${fmt(list[i].kg)} kg</b> <span class="muted">· Ø ${fmt(avgs[i])}</span>`);
  }
}

function foodPrompt(desc) {

// Liest die Werte aus der KI-Antwort. Versteht auch Spannen wie "30-35" und Kommazahlen.
function parseFood(text) {
  if (!text) return null;
  const t = text.replace(/\*\*/g, "");
  const val = re => {
    const m = t.match(re); if (!m) return null;
    const a = parseFloat(m[1].replace(",", ".")), b = m[2] ? parseFloat(m[2].replace(",", ".")) : null;
    return b != null && !isNaN(b) ? (a + b) / 2 : a;
  };
  const n = "(\\d+(?:[.,]\\d+)?)(?:\\s*(?:-|–|bis)\\s*(\\d+(?:[.,]\\d+)?))?";
  const kcal = val(new RegExp(`(?:kcal|kalorien|energie)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const p = val(new RegExp(`(?:protein|eiwei(?:ß|ss))\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const c = val(new RegExp(`(?:\\bkh\\b|kohlenhydrate)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const f = val(new RegExp(`(?:\\bfett\\b)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  if (kcal == null && p == null) return null;
  const nm = t.match(/GERICHT\s*:\s*(.+)/i);
  return { name: nm ? nm[1].trim().replace(/[<>]/g, "").slice(0, 80) : "", kcal: round(kcal), p: round(p), c: round(c), f: round(f) };
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }

    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove(); return ok;
  }
}

    ${macroBar("Protein", t.p, s.proteinGoal)}
    ${compact ? "" : macroBar("Kohlenhydrate", t.c, s.carbGoal) + macroBar("Fett", t.f, s.fatGoal)}
    ${!s.kcalGoal && !compact ? `<div class="small muted" style="margin-top:10px">Tipp: Unter „Mehr“ kannst du Tagesziele für Kalorien und Makros setzen.</div>` : ""}`;
}
let fDate = null, fDraft = null, fLastSaved = null;
function renderFood() {
  if (!fDate) fDate = today();
  const isToday = fDate === today();
  const meals = db.meals.filter(m => m.date === fDate);
  const app = AI_APPS[db.settings.aiApp] || AI_APPS.chatgpt;
  const favNames = new Set(db.favorites.map(f => f.name.toLowerCase()));
  $("#view").innerHTML = `
    <div class="datebar">
      <button class="icon-btn" id="fPrev" aria-label="Vorheriger Tag">‹</button>
      <b>${isToday ? "Heute" : relDay(fDate) === "gestern" ? "Gestern" : WD[parse(fDate).getDay()] + ", " + short(fDate)}</b>
      <button class="icon-btn" id="fNext" aria-label="Nächster Tag" ${isToday ? "disabled style='opacity:.3'" : ""}>›</button>
    </div>
    <div class="card">${nutritionSummary(fDate)}</div>

    <div class="card" id="aiCard">
      <h2>Essen analysieren</h2>
      <div class="row">
        <div class="grow"><label class="f">Mahlzeit</label><select id="fMeal">${MEALS.map(m => `<option ${m === (fDraft && fDraft.meal || mealNow()) ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      </div>
      <div style="margin-top:10px"><label class="f">Optional: Menge oder Details</label><input id="fDesc" placeholder="z. B. ca. 250 g Reis, mit Öl gebraten" autocomplete="off"></div>
      <div class="step"><span class="n">1</span><div class="grow">
        <button class="btn" id="fAsk" style="width:100%;white-space:normal">Anfrage kopieren${app.url ? ` & ${app.name} öffnen` : ""}</button>
        <div class="small muted" style="margin-top:6px">In ${app.url ? app.name : "deiner KI-App"}: Anfrage einfügen, Foto anhängen, senden. Dann die Antwort kopieren.</div>
      </div></div>
      <div class="step"><span class="n">2</span><div class="grow">
        <button class="btn ghost" id="fPaste" style="width:100%">Antwort einfügen</button>
        <textarea id="fAns" placeholder="… oder die Antwort hier hineinkopieren" style="margin-top:8px"></textarea>
      </div></div>
      <div id="fEditWrap"></div>
      <div class="row" style="margin-top:12px"><button class="btn small ghost grow" id="fManual">Ohne KI manuell eintragen</button></div>
      ${fLastSaved ? `<div class="ok-box"><div class="row"><span class="grow">Gespeichert: <b>${esc(fLastSaved.name || "Mahlzeit")}</b>, ${fLastSaved.kcal} kcal</span>
        <button class="btn small" id="fYazioLast">Für Yazio kopieren</button></div></div>` : ""}
    </div>

    <div class="card"><h2>${isToday ? "Heute gegessen" : "Gegessen"}</h2>
      ${meals.length ? MEALS.filter(ml => meals.some(m => m.meal === ml)).map(ml => {
        const list = meals.filter(m => m.meal === ml);
        return `<div class="meal-title"><span>${ml}</span><span class="muted">${list.reduce((s, m) => s + m.kcal, 0)} kcal</span></div>` +
          list.map(m => `<div class="entry" data-id="${m.id}">
            <div class="grow"><div>${esc(m.name || "Mahlzeit")}</div><div class="small muted">${m.p} g P · ${m.c} g KH · ${m.f} g F</div></div>
            <b style="margin:0 4px">${m.kcal}</b>
            <button class="icon-btn m-fav" aria-label="Als Favorit" title="Als Favorit">${favNames.has((m.name || "").toLowerCase()) ? "★" : "☆"}</button>
            <button class="icon-btn m-copy" aria-label="Für Yazio kopieren" title="Für Yazio kopieren">⧉</button>
            <button class="icon-btn m-del" aria-label="Löschen">✕</button></div>`).join("");
      }).join("") : `<div class="empty">Noch nichts eingetragen.</div>`}
    </div>

    <div class="card"><h2>Favoriten</h2>
      ${db.favorites.length ? `<div class="small muted" style="margin:-4px 0 6px">Tippe auf +, um ein Gericht als ${"<span id='favMealLbl'></span>"} einzutragen.</div>` +
        db.favorites.map(f => `<div class="fav" data-id="${f.id}"><div class="grow"><div>${esc(f.name)}</div><div class="small muted">${f.kcal} kcal · ${f.p} g P · ${f.c} g KH · ${f.f} g F</div></div>
          <button class="icon-btn f-del" aria-label="Favorit entfernen">✕</button>
          <button class="btn small f-add" aria-label="Eintragen">+</button></div>`).join("")
        : `<div class="empty">Tippe bei einem Eintrag auf ☆, um ihn als Favorit zu speichern. Dann trägst du ihn nächstes Mal mit einem Tipp ein.</div>`}
    </div>`;

  const mealSel = $("#fMeal");
  const lbl = () => { const l = $("#favMealLbl"); if (l) l.textContent = mealSel.value; };
  mealSel.addEventListener("change", lbl); lbl();
  $("#fPrev").addEventListener("click", () => { fDate = addDays(fDate, -1); fDraft = null; fLastSaved = null; render(); });
  $("#fNext").addEventListener("click", () => { if (fDate < today()) { fDate = addDays(fDate, 1); fDraft = null; fLastSaved = null; render(); } });

  $("#fAsk").addEventListener("click", () => {
    const prompt = foodPrompt($("#fDesc").value.trim());
    copyText(prompt).then(ok => toast(ok ? "Anfrage kopiert" : "Kopieren nicht möglich"));
    if (app.url) window.open(app.url, "_blank");
  });
  const showEditor = d => { fDraft = Object.assign({ name: "", kcal: 0, p: 0, c: 0, f: 0 }, d, { meal: mealSel.value }); drawEditor(); };
  const tryParse = text => {
    const r = parseFood(text);
    if (r) { showEditor(r); toast("Werte erkannt, bitte prüfen"); }
    else if (text.trim()) toast("Keine Werte gefunden. Steht die WERTE-Zeile in der Antwort?");
  };
  $("#fPaste").addEventListener("click", async () => {
    try { const text = await navigator.clipboard.readText(); $("#fAns").value = text; tryParse(text); }
    catch (e) { $("#fAns").focus(); toast("Lange in das Feld tippen → Einsetzen"); }
  });
  $("#fAns").addEventListener("input", e => { if (parseFood(e.target.value)) tryParse(e.target.value); });
  $("#fManual").addEventListener("click", () => showEditor({}));
  const yl = $("#fYazioLast"); if (yl) yl.addEventListener("click", () => copyText(yazioText(fLastSaved)).then(ok => toast(ok ? "Für Yazio kopiert" : "Kopieren nicht möglich")));

  $("#view").querySelectorAll(".entry[data-id]").forEach(row => {
    const m = db.meals.find(x => x.id === row.dataset.id);
    row.querySelector(".m-del").addEventListener("click", () => { if (confirm("Eintrag löschen?")) { db.meals = db.meals.filter(x => x.id !== m.id); save(); render(); } });
    row.querySelector(".m-copy").addEventListener("click", () => copyText(yazioText(m)).then(ok => toast(ok ? "Für Yazio kopiert" : "Kopieren nicht möglich")));
    row.querySelector(".m-fav").addEventListener("click", () => {
      const key = (m.name || "").toLowerCase();
      if (db.favorites.some(f => f.name.toLowerCase() === key)) { db.favorites = db.favorites.filter(f => f.name.toLowerCase() !== key); toast("Favorit entfernt"); }
      else { db.favorites.push({ id: uid(), name: m.name || "Mahlzeit", kcal: m.kcal, p: m.p, c: m.c, f: m.f }); toast("Als Favorit gespeichert"); }
      save(); render();
    });
  });
  $("#view").querySelectorAll(".fav[data-id]").forEach(row => {
    const f = db.favorites.find(x => x.id === row.dataset.id);
    row.querySelector(".f-add").addEventListener("click", () => {
      const m = { id: uid(), date: fDate, meal: mealSel.value, name: f.name, kcal: f.kcal, p: f.p, c: f.c, f: f.f };
      db.meals.push(m); fLastSaved = m; save(); render(); toast(`${f.name} eingetragen`);
    });
    row.querySelector(".f-del").addEventListener("click", () => { if (confirm(`„${f.name}“ aus den Favoriten entfernen?`)) { db.favorites = db.favorites.filter(x => x.id !== f.id); save(); render(); } });
  });
  if (fDraft) drawEditor();
}
function drawEditor() {
  const d = fDraft, w = $("#fEditWrap"); if (!w) return;
  w.innerHTML = `<form id="fEdit" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
    <h2>Prüfen und speichern</h2>
    <label class="f">Name</label><input id="eName" value="${esc(d.name)}" placeholder="z. B. Hähnchen mit Reis">
    <div class="row" style="margin-top:10px">
      <div class="grow"><label class="f">Kalorien (kcal)</label><input id="eK" inputmode="numeric" value="${d.kcal || ""}"></div>
      <div class="grow"><label class="f">Protein (g)</label><input id="eP" inputmode="decimal" value="${d.p || ""}"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="grow"><label class="f">Kohlenhydrate (g)</label><input id="eC" inputmode="decimal" value="${d.c || ""}"></div>
      <div class="grow"><label class="f">Fett (g)</label><input id="eF" inputmode="decimal" value="${d.f || ""}"></div>
    </div>
    <label class="row small" style="margin-top:12px;gap:8px;color:var(--text-2)"><input type="checkbox" id="eFav" style="width:20px;height:20px;-webkit-appearance:checkbox;appearance:auto"> Auch als Favorit speichern</label>
    <div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="eCancel">Abbrechen</button><button class="btn grow" type="submit">Speichern</button></div>
  </form>`;
  $("#eCancel").addEventListener("click", () => { fDraft = null; w.innerHTML = ""; });
  $("#fEdit").addEventListener("submit", e => {
    e.preventDefault();
    const v = id => Math.max(0, round(num($(id).value)));
    const m = { id: uid(), date: fDate, meal: $("#fMeal").value, name: $("#eName").value.trim() || "Mahlzeit", kcal: v("#eK"), p: v("#eP"), c: v("#eC"), f: v("#eF") };
    if (!m.kcal && !m.p && !m.c && !m.f) { toast("Bitte mindestens einen Wert eintragen"); return; }
    db.meals.push(m);
    if ($("#eFav").checked && !db.favorites.some(f => f.name.toLowerCase() === m.name.toLowerCase()))
      db.favorites.push({ id: uid(), name: m.name, kcal: m.kcal, p: m.p, c: m.c, f: m.f });
    fDraft = null; fLastSaved = m; save(); render(); toast("Gespeichert");
  });
  w.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- Mehr ---------- */
function renderMore() {
  const s = db.settings;
  $("#view").innerHTML = `
    <h1>Mehr</h1><p class="sub">Ziele, Backup und was als Nächstes kommt.</p>
    <form class="card" id="setForm"><h2>Ziele</h2>
      <div class="row">
        <div class="grow"><label class="f">Zielgewicht (kg)</label><input id="gW" inputmode="decimal" placeholder="optional" value="${s.goalWeight ? fmt(s.goalWeight) : ""}"></div>
        <div class="grow"><label class="f">Schlafziel (Stunden)</label><input id="gS" inputmode="decimal" value="${fmt(s.sleepGoal, s.sleepGoal % 1 ? 1 : 0)}"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f">Kalorien pro Tag (kcal)</label><input id="gK" inputmode="numeric" placeholder="optional" value="${s.kcalGoal || ""}"></div>
        <div class="grow"><label class="f">Protein (g)</label><input id="gP" inputmode="numeric" placeholder="optional" value="${s.proteinGoal || ""}"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f">Kohlenhydrate (g)</label><input id="gC" inputmode="numeric" placeholder="optional" value="${s.carbGoal || ""}"></div>
        <div class="grow"><label class="f">Fett (g)</label><input id="gF" inputmode="numeric" placeholder="optional" value="${s.fatGoal || ""}"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn grow" type="submit">Ziele speichern</button></div>
    </form>
    <div class="card"><h2>KI-App</h2>
      <label class="f">Welche KI-App soll der KI-Knopf öffnen?</label>
      <select id="aiApp">${Object.entries(AI_APPS).map(([k, a]) => `<option value="${k}" ${s.aiApp === k ? "selected" : ""}>${a.name === "nur kopieren" ? "Keine öffnen, nur kopieren" : a.name}</option>`).join("")}</select>
      <p class="small muted" style="margin-bottom:0">Die App kopiert die Anfrage in die Zwischenablage. Ist die KI-App installiert, öffnet sie sich meist direkt, sonst die Webseite. Achte auf die Altersgrenze der KI-App.</p>
    </div>
    <div class="card"><h2>Backup</h2>
      <p class="small muted" style="margin-top:0">Deine Daten liegen nur auf diesem iPhone. Sichere sie ab und zu, z. B. in der Dateien-App oder iCloud.</p>
      <div class="row wrap">
        <button class="btn ghost grow" id="exp">Backup sichern</button>
        <button class="btn ghost grow" id="impBtn">Backup laden</button>
        <input type="file" id="imp" accept="application/json,.json" hidden>
      </div>
      <p class="small muted" style="margin-bottom:0">${db.todos.length} Todos · ${db.weights.length} Gewichtseinträge · ${db.sleep.length} Schlafeinträge · ${db.meals.length} Mahlzeiten · ${db.favorites.length} Favoriten</p>
    </div>
    <div class="card"><h2>Kommt bald</h2>
      <div class="soon"><span class="pill">Phase 3</span><div><b>Schule</b><div class="small muted">Fächer, Dateien, KI-Knöpfe zum Zusammenfassen und Erklären, Karteikarten, Klausuren.</div></div></div>
      <div class="soon"><span class="pill">Phase 4</span><div><b>Gym</b><div class="small muted">Trainingspläne, Sätze und Gewichte, Kraftkurven, Bestleistungen.</div></div></div>
    </div>`;
  $("#setForm").addEventListener("submit", e => {
    e.preventDefault();
    const g = num($("#gW").value), sg = num($("#gS").value);
    s.goalWeight = g && g > 20 ? Math.round(g * 10) / 10 : null;
    s.sleepGoal = sg && sg > 0 && sg < 16 ? sg : 8;
    const pos = id => { const v = num($(id).value); return v && v > 0 ? Math.round(v) : null; };
    s.kcalGoal = pos("#gK"); s.proteinGoal = pos("#gP"); s.carbGoal = pos("#gC"); s.fatGoal = pos("#gF");
    save(); toast("Ziele gespeichert");
  });
  $("#aiApp").addEventListener("change", e => { s.aiApp = e.target.value; save(); toast("Gespeichert"); });
  $("#exp").addEventListener("click", async () => {
    const name = `tagwerk-backup-${today()}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $("#impBtn").addEventListener("click", () => $("#imp").click());
  $("#imp").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.todos) || !Array.isArray(d.weights) || !Array.isArray(d.sleep)) throw 0;
      if (!confirm("Backup laden? Die aktuellen Daten werden ersetzt.")) return;
      db = Object.assign(blank(), d, { settings: Object.assign(blank().settings, d.settings || {}) });
      save(); render(); toast("Backup geladen");
    } catch (err) { toast("Das ist keine gültige Backup-Datei"); }
  });
}

/* ---------- Start ---------- */
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
