<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tagwerk</title>
<style>
  :root {
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242422;
    --border: #383835;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8f8e86;
    --accent: #3987e5;
    --accent-soft: rgba(57,135,229,.16);
    --good: #0ca30c;
    --critical: #e66767;
    --grid: #2c2c2a;
    --radius: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-top: var(--safe-t);
    padding-bottom: calc(76px + var(--safe-b));
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 24px; }
  h1 { font-size: 28px; font-weight: 700; margin: 8px 0 2px; letter-spacing: -.02em; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 10px; }
  .sub { color: var(--text-2); margin: 0 0 18px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--text-3); }
  .muted { color: var(--text-3); }
  .small { font-size: 13px; }
  input, select, button { font: inherit; font-size: 16px; color: var(--text); }
  input, select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none;
  }
  input[type="date"], input[type="time"] { min-height: 44px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  label.f { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 16px;
    font-weight: 600; cursor: pointer; white-space: nowrap; min-height: 44px;
  }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.small { padding: 6px 12px; min-height: 34px; font-size: 14px; }
  .icon-btn { background: none; border: 0; color: var(--text-3); padding: 8px; cursor: pointer; font-size: 18px; line-height: 1; min-width: 36px; min-height: 36px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .seg button { background: none; border: 0; padding: 5px 12px; border-radius: 8px; color: var(--text-2); font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); }

  /* Todos */
  .todo { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
  .todo:first-child { border-top: 0; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-3); background: none; flex: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .check.done { background: var(--accent); border-color: var(--accent); }
  .check.done::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .todo .t { flex: 1; min-width: 0; word-wrap: break-word; }
  .todo.isdone .t { color: var(--text-3); text-decoration: line-through; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
  .due { font-size: 12px; color: var(--text-3); }
  .due.late { color: var(--critical); }
  .group-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 4px 0 2px; }
  .empty { color: var(--text-3); padding: 6px 0; }

  /* Charts */
  .chart { position: relative; width: 100%; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -100%);
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none; z-index: 5;
  }
  .tip b { font-variant-numeric: tabular-nums; }

  /* Entry lists */
  .entry { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .entry:first-child { border-top: 0; }

  /* Quality picker */
  .q { display: flex; gap: 6px; }
  .q button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-size: 16px; cursor: pointer; }
  .q button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(26,26,25,.92);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around;
    padding: 6px 4px calc(6px + var(--safe-b)); z-index: 10;
  }
  nav.tabs button { background: none; border: 0; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 4px 6px; min-width: 52px; cursor: pointer; }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button.on { color: var(--accent); }

  .soon { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border); }
  .soon:first-of-type { border-top: 0; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .dash-link { cursor: pointer; }
  .toast { max-width: 90vw; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 99px; font-size: 14px; display: none; z-index: 20; }
  [hidden] { display: none !important; }
  body.gated nav.tabs { display: none; }
  body.gated { padding-bottom: 24px; }
  textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 70px; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .macro { margin-top: 12px; }
  .macro .row { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .kcal-big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .step { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; }
  .step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 10px; }
  .meal-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 10px 0 0; display: flex; justify-content: space-between; }
  .meal-title:first-child { margin-top: 0; }
  .fav { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
  .fav:first-of-type { border-top: 0; }
  .datebar { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
  .datebar b { font-size: 20px; }
  .md { margin-top: 8px; font-size: 14px; color: var(--text-2); }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; } .md li { margin: 3px 0; }
  .md-h { font-weight: 650; color: var(--text); margin: 12px 0 4px; } .md b { color: var(--text); }
  .md code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  details.note { border-top: 1px solid var(--border); padding: 10px 0; } details.note:first-of-type { border-top: 0; }
  details > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; }
  details > summary::-webkit-details-marker { display: none; }
  .flash { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 18px; min-height: 300px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .flash .fq { font-size: 21px; font-weight: 600; line-height: 1.35; }
  .flash .fa { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 17px; }
  .setgrid { display: grid; grid-template-columns: 34px 1fr 1fr 40px; gap: 8px; align-items: center; margin-top: 8px; }
  .setgrid.head { font-size: 12px; color: var(--text-3); margin-top: 12px; }
  .setgrid input { padding: 8px 10px; text-align: center; font-variant-numeric: tabular-nums; }
  .setgrid.done input { border-color: var(--accent); background: var(--accent-soft); }
  .setgrid .check { justify-self: center; width: 30px; height: 30px; }
  .restbar { position: fixed; left: 12px; right: 12px; bottom: calc(80px + var(--safe-b)); max-width: 616px; margin: 0 auto; background: var(--surface-2); border: 1px solid var(--accent); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; z-index: 15; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  body.resting { padding-bottom: calc(150px + var(--safe-b)); }
  .restbar span { color: var(--text-2); } .restbar b { font-size: 22px; font-variant-numeric: tabular-nums; flex: 1; }
  .ok-box { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<main id="view"></main>
<div class="toast" id="toast"></div>
<div class="restbar" id="restBar" hidden><span>Pause</span><b>1:30</b><button class="btn small ghost" onclick="restUntil=0;tickRest()">Überspringen</button></div>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Übersicht</button>
  <button data-tab="todos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6.5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="17.5" r="1.6"/><path d="M10 6.5h10M10 12h10M10 17.5h10"/></svg>Todos</button>
  <button data-tab="school"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>Schule</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10"/><path d="M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></svg>Essen</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Körper</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>Mehr</button>
</nav>

<script src="config.js"></script>
<script>
"use strict";
/* ---------- Speicher ---------- */
const KEY = "tagwerk_v1";
const blank = () => ({ todos: [], weights: [], sleep: [], meals: [], favorites: [], subjects: [], files: [], exams: [], notes: [], cards: [], plans: [], workouts: [], gymNotes: [], activeWorkout: null,
  settings: { goalWeight: null, sleepGoal: 8, kcalGoal: null, proteinGoal: null, carbGoal: null, fatGoal: null, aiApp: "chatgpt", grade: "", restSec: 90 } });
const normalize = d => Object.assign(blank(), d && typeof d === "object" ? d : {}, { settings: Object.assign(blank().settings, (d && d.settings) || {}) });
let db = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && typeof d === "object") return normalize(d); } catch (e) {}
  return blank();
}
function writeLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast("Speichern fehlgeschlagen"); }
}
// Jede Änderung: lokal speichern und kurz danach mit dem Konto abgleichen
function save() { writeLocal(); markDirty(); }

/* ---------- Helfer ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const short = s => { const d = parse(s); return `${d.getDate()}. ${MONTHS[d.getMonth()]}`; };
const fmt = (n, dig = 1) => n == null || isNaN(n) ? "–" : n.toLocaleString("de-DE", { minimumFractionDigits: dig, maximumFractionDigits: dig });
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const hm = h => { const t = Math.round(h * 60); return `${Math.floor(t / 60)} h ${pad(t % 60)} min`; };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 1800); }
function relDay(s) {
  const d = dayDiff(today(), s);
  if (d === 0) return "heute"; if (d === 1) return "morgen"; if (d === -1) return "gestern";
  if (d < 0) return `seit ${-d} Tagen`; if (d < 7) return WD[parse(s).getDay()] + ", " + short(s);
  return short(s);
}

/* ---------- Berechnungen ---------- */
const weightsSorted = () => [...db.weights].sort((a, b) => a.date.localeCompare(b.date));
// 7-Tage-Durchschnitt: Mittel aller Einträge der letzten 7 Tage bis einschließlich Datum
function avg7(list, date) {
  const from = addDays(date, -6);
  const w = list.filter(e => e.date >= from && e.date <= date);
  return w.length ? w.reduce((s, e) => s + e.kg, 0) / w.length : null;
}
function weightStats() {
  const l = weightsSorted();
  if (!l.length) return null;
  const last = l[l.length - 1];
  const a = avg7(l, last.date);
  const prevDate = addDays(last.date, -7);
  const prev = l.filter(e => e.date <= prevDate).length ? avg7(l, prevDate) : null;
  return { last, avg: a, perWeek: prev != null ? a - prev : null };
}
function sleepHours(e) {
  const [bh, bm] = e.bed.split(":").map(Number), [wh, wm] = e.wake.split(":").map(Number);
  let m = (wh * 60 + wm) - (bh * 60 + bm); if (m <= 0) m += 1440; return m / 60;
}
const sleepSorted = () => [...db.sleep].sort((a, b) => a.date.localeCompare(b.date));
function sleepAvg(days) {
  const from = addDays(today(), -(days - 1));
  const l = db.sleep.filter(e => e.date >= from);
  return l.length ? l.reduce((s, e) => s + sleepHours(e), 0) / l.length : null;
}

/* ---------- Konto & Sync (Supabase) ---------- */
const CFG = window.TAGWERK_CONFIG || {};
const SB_URL = String(CFG.supabaseUrl || "").trim().replace(/\/+$/, ""), SB_KEY = String(CFG.supabaseKey || "").trim();
const cloudOn = !!(SB_URL && SB_KEY);
const SKEY = "tagwerk_session", MKEY = "tagwerk_sync";
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
let session = cloudOn ? readJSON(SKEY) : null;
let syncMeta = Object.assign({ lastSynced: null, dirty: false, owner: null, lastOk: null }, readJSON(MKEY) || {});
let syncState = "idle", syncTimer = null, syncing = null, syncAgain = false, pendingRender = false, refreshing = null;
const saveMeta = () => { try { localStorage.setItem(MKEY, JSON.stringify(syncMeta)); } catch (e) {} };
const saveSession = () => { if (session) localStorage.setItem(SKEY, JSON.stringify(session)); else localStorage.removeItem(SKEY); };
const loggedIn = () => cloudOn && !!session;

function markDirty() {
  if (!loggedIn()) return;
  syncMeta.dirty = true; saveMeta();
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500);
}
function setSession(j) {
  session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } };
  saveSession();
}
function authError(j, status) {
  const m = String((j && (j.error_description || j.msg || j.message || j.error)) || "");
  if (/invalid login credentials/i.test(m)) return "E-Mail oder Passwort ist falsch.";
  if (/email not confirmed/i.test(m)) return "Bitte bestätige zuerst deine E-Mail (Link im Postfach).";
  if (/already registered|already exists/i.test(m)) return "Für diese E-Mail gibt es schon ein Konto. Melde dich an.";
  if (/password/i.test(m) && /(least|short|weak|characters)/i.test(m)) return "Das Passwort ist zu kurz oder zu schwach (mindestens 6 Zeichen).";
  if (/signups? not allowed|signup.*disabled/i.test(m)) return "Neue Konten sind in Supabase gerade deaktiviert.";
  if (/rate limit/i.test(m) || status === 429) return "Zu viele Versuche. Warte kurz und probier es nochmal.";
  if (/invalid.*email|email.*invalid/i.test(m)) return "Die E-Mail-Adresse ist ungültig.";
  return m || `Fehler ${status}`;
}
async function authCall(path, body) {
  let r;
  try { r = await fetch(SB_URL + path, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
  catch (e) { throw new Error("Keine Verbindung. Bist du online? Stimmt die Supabase-Adresse in config.js?"); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(authError(j, r.status)); err.status = r.status; throw err; }
  return j || {};
}
async function refreshToken() {
  if (refreshing) return refreshing;
  refreshing = (async () => {
    try { setSession(await authCall("/auth/v1/token?grant_type=refresh_token", { refresh_token: session.refresh_token })); }
    catch (e) { if (e.status && e.status >= 400 && e.status < 500) { forceLogout("Deine Anmeldung ist abgelaufen. Bitte melde dich neu an."); } throw e; }
    finally { refreshing = null; }
  })();
  return refreshing;
}
async function sbFetch(path, opt = {}, retried) {
  if (!session) throw new Error("nicht angemeldet");
  if (session.expires_at * 1000 - 60000 < Date.now()) await refreshToken();
  const headers = Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": "application/json" }, opt.headers || {});
  if (!headers["Content-Type"]) delete headers["Content-Type"];
  const r = await fetch(SB_URL + path, Object.assign({}, opt, { headers }));
  if (r.status === 401 && !retried) { await refreshToken(); return sbFetch(path, opt, true); }
  return r;
}
// Zwei Stände zusammenführen (wenn auf zwei Geräten offline geändert wurde): alles bleibt erhalten, bei gleichen Einträgen gewinnt dieses Gerät
function mergeData(local, remote) {
  const L = normalize(local), out = normalize(remote);
  const keyOf = { weights: x => x.date, sleep: x => x.date };
  Object.keys(blank()).forEach(k => {
    if (!Array.isArray(out[k])) return;
    const kf = keyOf[k] || (x => x.id), map = new Map(out[k].map(x => [kf(x), x]));

async function doSync() {

    if (!r.ok) throw new Error("HTTP " + r.status);

/* ---------- Diagramm-Grundlagen ---------- */
function niceTicks(min, max, count) {
  const span = max - min || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
function attachTip(box, svg, pts, xs, html, onMove) {
  let tip = box.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
  const cross = svg.querySelector(".cross");
  const show = ev => {
    const r = svg.getBoundingClientRect(), scale = r.width / svg.viewBox.baseVal.width;
    const p = ev.touches ? ev.touches[0] : ev;
    const x = (p.clientX - r.left) / scale;
    let best = 0, bd = Infinity;
    xs.forEach((v, i) => { const d = Math.abs(v - x); if (d < bd) { bd = d; best = i; } });
    const pt = pts[best];
    tip.innerHTML = html(best); tip.style.display = "block";
    const left = Math.min(Math.max(pt.x * scale, 70), r.width - 70);
    tip.style.left = left + "px"; tip.style.top = (pt.y * scale - 10) + "px";
    if (cross) { cross.setAttribute("x1", pt.x); cross.setAttribute("x2", pt.x); cross.style.display = ""; }
    if (onMove) onMove(best);
  };
  const hide = () => { tip.style.display = "none"; if (cross) cross.style.display = "none"; if (onMove) onMove(-1); };
  svg.addEventListener("mousemove", show); svg.addEventListener("mouseleave", hide);
  svg.addEventListener("touchstart", show, { passive: true }); svg.addEventListener("touchmove", show, { passive: true });
  svg.addEventListener("touchend", () => setTimeout(hide, 1500));
}

function weightChart(box, list, opt = {}) {

  const all = weightsSorted();
  const W = Math.max(280, box.clientWidth || 320), H = opt.mini ? 110 : 240;
  const m = { l: 40, r: 12, t: 12, b: opt.mini ? 8 : 26 };
  if (!list.length) { box.innerHTML = `<div class="empty">Noch keine Daten in diesem Zeitraum.</div>`; return; }
  const avgs = list.map(e => avg7(all, e.date));
  const goal = db.settings.goalWeight;
  let lo = Math.min(...list.map(e => e.kg)), hi = Math.max(...list.map(e => e.kg));
  if (goal && !opt.mini) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if (hi - lo < 2) { const c = (hi + lo) / 2; lo = c - 1; hi = c + 1; }
  const ticks = niceTicks(lo, hi, opt.mini ? 2 : 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const d0 = list[0].date, dn = Math.max(1, dayDiff(d0, list[list.length - 1].date));
  const X = d => m.l + (dayDiff(d0, d) / dn) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const xs = list.map(e => list.length === 1 ? (m.l + W - m.r) / 2 : X(e.date));
  const avgPath = avgs.map((a, i) => `${i ? "L" : "M"}${xs[i].toFixed(1)} ${Y(a).toFixed(1)}`).join("");
  // x-Achsen-Beschriftung: bis zu 4 Datumswerte
  let xl = "";
  if (!opt.mini) {
    const n = Math.min(4, list.length), idx = [...new Set(Array.from({ length: n }, (_, i) => Math.round(i * (list.length - 1) / Math.max(1, n - 1))))];
    xl = idx.map((i, k) => `<text x="${xs[i]}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="${k === 0 && idx.length > 1 ? "start" : k === idx.length - 1 && idx.length > 1 ? "end" : "middle"}">${short(list[i].date)}</text>`).join("");
  }
  box.innerHTML = `${opt.mini ? "" : `<div class="legend">
      <span><i style="width:8px;height:8px;border-radius:50%;background:var(--text-3)"></i>Tageswert</span>
      <span><i style="width:16px;height:2px;background:var(--accent)"></i>Ø 7 Tage</span>
      ${goal ? `<span><i style="width:16px;border-top:2px dashed var(--good)"></i>Ziel ${fmt(goal)} kg</span>` : ""}
    </div>`}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/>
        <text x="${m.l - 8}" y="${Y(t) + 4}" font-size="11" fill="var(--text-3)" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join("")}
      ${goal && !opt.mini ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>` : ""}
      <line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" stroke-width="1" style="display:none"/>
      ${list.map((e, i) => `<circle cx="${xs[i]}" cy="${Y(e.kg)}" r="${opt.mini ? 2.5 : 4}" fill="var(--text-3)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      <path d="${avgPath}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xl}
    </svg>`;
  if (!opt.mini) {
    const svg = box.querySelector("svg");
    attachTip(box, svg, list.map((e, i) => ({ x: xs[i], y: Math.min(Y(e.kg), Y(avgs[i])) })), xs,
      i => `${short(list[i].date)}<br><b>${fmt(list[i].kg)} kg</b> <span class="muted">· Ø ${fmt(avgs[i])}</span>`);
  }
}

function sleepChart(box) {
  const W = Math.max(280, box.clientWidth || 320), H = 200, m = { l: 34, r: 10, t: 12, b: 26 };
  const days = Array.from({ length: 14 }, (_, i) => addDays(today(), i - 13));
  const map = Object.fromEntries(db.sleep.map(e => [e.date, e]));
  const vals = days.map(d => map[d] ? sleepHours(map[d]) : null);
  const goal = db.settings.sleepGoal || 8;
  const top = Math.max(10, Math.ceil(Math.max(goal, ...vals.filter(v => v != null)) / 2) * 2);
  const ticks = []; for (let v = 0; v <= top; v += 2) ticks.push(v);
  const bw = (W - m.l - m.r) / days.length, barW = Math.max(6, bw - 6);
  const Y = v => m.t + (1 - v / top) * (H - m.t - m.b);
  const xs = days.map((_, i) => m.l + bw * i + bw / 2);
  const bar = (x, v) => { // oben abgerundet, unten bündig
    const y = Y(v), h = Y(0) - y, r = Math.min(4, h / 2, barW / 2), x0 = x - barW / 2;
    return `M${x0} ${Y(0)}V${y + r}Q${x0} ${y} ${x0 + r} ${y}H${x0 + barW - r}Q${x0 + barW} ${y} ${x0 + barW} ${y + r}V${Y(0)}Z`;
  };
  box.innerHTML = `<div class="legend">
      <span><i style="width:10px;height:10px;border-radius:2px;background:var(--accent)"></i>Schlafdauer</span>
      <span><i style="width:16px;border-top:2px dashed var(--good)"></i>Ziel ${fmt(goal, goal % 1 ? 1 : 0)} h</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schlaf der letzten 14 Nächte">
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(t) + 4}" font-size="11" fill="var(--text-3)" text-anchor="end">${t} h</text>`).join("")}
      ${vals.map((v, i) => v == null ? "" : `<path class="sb" data-i="${i}" d="${bar(xs[i], v)}" fill="var(--accent)"/>`).join("")}
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>
      ${days.map((d, i) => (i % 2 === 1 || i === 13) ? `<text x="${xs[i]}" y="${H - 8}" font-size="11" fill="${d === today() ? "var(--text)" : "var(--text-3)"}" text-anchor="middle">${WD[parse(d).getDay()]}</text>` : "").join("")}
    </svg>`;
  const svg = box.querySelector("svg");
  const has = vals.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
  if (!has.length) return;
  attachTip(box, svg, has.map(i => ({ x: xs[i], y: Y(vals[i]) })), has.map(i => xs[i]),
    k => { const i = has[k], e = map[days[i]]; return `${WD[parse(days[i]).getDay()]}, ${short(days[i])}<br><b>${hm(vals[i])}</b> <span class="muted">· ${e.bed}–${e.wake}${e.quality ? " · " + e.quality + "/5" : ""}</span>`; },
    k => svg.querySelectorAll(".sb").forEach(p => p.setAttribute("fill-opacity", k < 0 || +p.dataset.i === has[k] ? 1 : .45)));
}

  $("#sForm").addEventListener("submit", e => {

const mealNow = () => { const h = new Date().getHours(); return h < 10 ? "Frühstück" : h < 15 ? "Mittagessen" : h < 21 ? "Abendessen" : "Snack"; };
const round = n => Math.round(n || 0);
function dayTotals(date) {
  return db.meals.filter(m => m.date === date).reduce((t, m) => ({ kcal: t.kcal + m.kcal, p: t.p + m.p, c: t.c + m.c, f: t.f + m.f }), { kcal: 0, p: 0, c: 0, f: 0 });
}
function foodPrompt(desc) {
  return [
    "Du bist ein Ernährungsassistent. Schätze die Nährwerte des Gerichts auf dem angehängten Foto.",
    desc ? `Zusatzinfo von mir: ${desc}` : "",
    "Gehe so vor: Erkenne die Lebensmittel, schätze die Portionsgrößen in Gramm und berechne daraus die Nährwerte.",
    "Antworte kurz: Liste die erkannten Lebensmittel mit geschätzter Menge. Wenn du unsicher bist, nenne in einem Satz, was die Schätzung am stärksten beeinflusst.",
    "Beende deine Antwort GENAU mit diesen zwei Zeilen (nur ganze Zahlen, ohne Einheiten):",
    "GERICHT: <kurzer Name des Gerichts>",
    "WERTE: kcal=<Zahl>; protein=<Zahl>; kh=<Zahl>; fett=<Zahl>",
  ].filter(Boolean).join("\n");
}
// Liest die Werte aus der KI-Antwort. Versteht auch Spannen wie "30-35" und Kommazahlen.
function parseFood(text) {
  if (!text) return null;
  const t = text.replace(/\*\*/g, "");
  const val = re => {
    const m = t.match(re); if (!m) return null;
    const a = parseFloat(m[1].replace(",", ".")), b = m[2] ? parseFloat(m[2].replace(",", ".")) : null;
    return b != null && !isNaN(b) ? (a + b) / 2 : a;
  };
  const n = "(\\d+(?:[.,]\\d+)?)(?:\\s*(?:-|–|bis)\\s*(\\d+(?:[.,]\\d+)?))?";
  const kcal = val(new RegExp(`(?:kcal|kalorien|energie)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const p = val(new RegExp(`(?:protein|eiwei(?:ß|ss))\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const c = val(new RegExp(`(?:\\bkh\\b|kohlenhydrate)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  const f = val(new RegExp(`(?:\\bfett\\b)\\s*[=:]?\\s*(?:ca\\.?\\s*)?${n}`, "i"));
  if (kcal == null && p == null) return null;
  const nm = t.match(/GERICHT\s*:\s*(.+)/i);
  return { name: nm ? nm[1].trim().replace(/[<>]/g, "").slice(0, 80) : "", kcal: round(kcal), p: round(p), c: round(c), f: round(f) };
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove(); return ok;
  }
}
const yazioText = m => `${m.name || "Mahlzeit"}: ${m.kcal} kcal, Protein ${m.p} g, Kohlenhydrate ${m.c} g, Fett ${m.f} g`;
function macroBar(label, val, goal, unit = "g") {
  const pct = goal ? Math.min(100, val / goal * 100) : 0;
  return `<div class="macro"><div class="row"><span class="grow">${label}</span><span><b style="color:var(--text)">${round(val)}</b>${goal ? ` / ${goal}` : ""} ${unit}</span></div>
    ${goal ? `<div class="bar"><span style="width:${pct}%"></span></div>` : ""}</div>`;
}

// Dateien liegen in IndexedDB (mehr Platz als localStorage)
const fileDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open("tagwerk-files", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction("files", mode), r = fn(t.objectStore("files"));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return { put: (id, v) => tx("readwrite", s => s.put(v, id)), get: id => tx("readonly", s => s.get(id)), del: id => tx("readwrite", s => s.delete(id)), clear: () => tx("readwrite", s => s.clear()) };
})();

const fileKind = n => { const e = n.split(".").pop().toLowerCase(); return ({ pdf: "PDF", doc: "Word", docx: "Word", ppt: "PowerPoint", pptx: "PowerPoint", jpg: "Bild", jpeg: "Bild", png: "Bild", heic: "Bild", txt: "Text" })[e] || e.toUpperCase(); };

// Kleine Markdown-Darstellung für KI-Antworten
function md(text) {
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const l of esc(text).split("\n")) {
    let m;
    if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { close(); }
    else if ((m = l.match(/^\s*#{1,6}\s+(.*)/))) { close(); out += `<div class="md-h">${inline(m[1])}</div>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}
// Liest Karteikarten im Format "F: … | A: …" (auch über zwei Zeilen verteilt)
function parseCards(text) {
  const lines = String(text || "").replace(/\*\*/g, "").split("\n").map(l => l.trim()).filter(Boolean), cards = [];
  const pre = "^(?:[-*•]\\s*)?(?:\\d+[.)]\\s*)?";
  for (let i = 0; i < lines.length; i++) {
    let m = lines[i].match(new RegExp(pre + "(?:F|Frage)\\s*[:：]\\s*(.+?)\\s*\\|\\s*(?:A|Antwort)\\s*[:：]\\s*(.+)$", "i"));
    if (m) { cards.push({ q: m[1], a: m[2] }); continue; }
    m = lines[i].match(new RegExp(pre + "(?:F|Frage)\\s*[:：]\\s*(.+)$", "i"));
    const n = lines[i + 1] && lines[i + 1].match(/^(?:[-*•]\s*)?(?:A|Antwort)\s*[:：]\s*(.+)$/i);
    if (m && n) { cards.push({ q: m[1], a: n[1] }); i++; }
  }
  return cards;
}

/* Lernmodus mit Karteikasten-Prinzip: gewusst → Stufe hoch, später wieder; nicht gewusst → Stufe 1, gleich nochmal */
function startLearn(sid) {
  const due = dueCards(sid), pool = due.length ? due : db.cards.filter(c => c.subjectId === sid);
  learnQueue = shuffle(pool.map(c => c.id)); learnIdx = 0; learnFlip = false; learnStats = { ok: 0, again: 0 };
  schoolLearn = sid; render(); window.scrollTo(0, 0);
}
function renderLearn() {
  const s = db.subjects.find(x => x.id === schoolLearn);
  if (!s) { schoolLearn = null; return render(); }
  const exit = () => { schoolLearn = null; render(); window.scrollTo(0, 0); };
  if (learnIdx >= learnQueue.length) {
    const nextDue = db.cards.filter(c => c.subjectId === s.id && c.due > today()).map(c => c.due).sort()[0];
    $("#view").innerHTML = `<div class="datebar"><button class="icon-btn" id="back" style="font-size:24px">‹</button><b>${esc(s.name)}</b><span style="width:36px"></span></div>
      <div class="card" style="text-align:center;padding:32px 16px"><div style="font-size:40px">✓</div><h1 style="font-size:24px">Geschafft</h1>
        <p class="sub">${learnStats.ok} gewusst · ${learnStats.again} wiederholt</p>
        ${nextDue ? `<p class="small muted">Nächste Wiederholung: ${relDay(nextDue)}</p>` : ""}
        <button class="btn" id="done" style="width:100%">Zurück zum Fach</button></div>`;
    $("#back").addEventListener("click", exit); $("#done").addEventListener("click", exit); return;
  }
  const c = db.cards.find(x => x.id === learnQueue[learnIdx]);
  if (!c) { learnIdx++; return renderLearn(); }
  $("#view").innerHTML = `
    <div class="datebar"><button class="icon-btn" id="back" aria-label="Beenden" style="font-size:24px">‹</button><b>${esc(s.name)}</b><span class="small muted">${learnIdx + 1}/${learnQueue.length}</span></div>
    <div class="bar" style="margin:-4px 0 16px"><span style="width:${learnIdx / learnQueue.length * 100}%"></span></div>
    <div class="flash" id="flash"><div class="small muted">Frage</div><div class="fq">${esc(c.q)}</div>
      ${learnFlip ? `<div class="fa"><div class="small muted">Antwort</div><div>${esc(c.a)}</div></div>` : `<div class="small muted" style="margin-top:auto">Tippen, um die Antwort zu sehen</div>`}</div>
    ${learnFlip ? `<div class="row" style="margin-top:14px"><button class="btn ghost grow" id="again">Nochmal</button><button class="btn grow" id="ok">Gewusst</button></div>`
      : `<button class="btn" id="flip" style="width:100%;margin-top:14px">Antwort zeigen</button>`}`;
  $("#back").addEventListener("click", exit);
  const flip = () => { if (!learnFlip) { learnFlip = true; render(); } };
  $("#flash").addEventListener("click", flip); const fb = $("#flip"); if (fb) fb.addEventListener("click", flip);
  const next = () => { learnFlip = false; learnIdx++; save(); render(); };
  const ok = $("#ok"); if (ok) ok.addEventListener("click", () => { c.box = Math.min(5, c.box + 1); c.due = addDays(today(), BOX_DAYS[c.box]); learnStats.ok++; next(); });
  const ag = $("#again"); if (ag) ag.addEventListener("click", () => { c.box = 1; c.due = today(); learnQueue.push(c.id); learnStats.again++; next(); });
}

/* ---------- Gym ---------- */
let editPlanId = null, gymEx = null, restUntil = 0, restDoneAt = 0, gymKiText = "";
const parseExLine = l => {
  const t = l.trim(); if (!t) return null;
  const m = t.match(/^(.+?)[\s,;:]+(\d+)\s*[x×]\s*(\d+(?:\s*[-–]\s*\d+)?)\s*$/i);
  return m ? { name: m[1].trim(), sets: Math.min(10, +m[2]) || 3, reps: m[3].replace(/\s/g, "").replace("–", "-") } : { name: t, sets: 3, reps: "8-12" };
};
const sameEx = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const workoutsSorted = () => [...db.workouts].sort((a, b) => a.date.localeCompare(b.date) || (a.start || "").localeCompare(b.start || ""));
function lastSetsFor(name) {
  const ws = workoutsSorted();
  for (let i = ws.length - 1; i >= 0; i--) { const e = ws[i].entries.find(x => sameEx(x.name, name)); if (e && e.sets.length) return e.sets; }
  return null;
}
const fmtKg = kg => fmt(kg, kg % 1 ? 1 : 0);
const fmtSet = s => s.kg ? `${fmtKg(s.kg)}×${s.reps}` : `${s.reps} Wdh.`;
const volume = w => w.entries.reduce((t, e) => t + e.sets.reduce((u, s) => u + (s.kg || 0) * (s.reps || 0), 0), 0);
function allExercises() {
  const count = new Map();
  db.workouts.forEach(w => w.entries.forEach(e => { const k = e.name.trim(); const f = [...count.keys()].find(x => sameEx(x, k)) || k; count.set(f, (count.get(f) || 0) + 1); }));
  return [...count.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function topSets(name) { // bester Satz pro Training
  return workoutsSorted().map(w => {
    const e = w.entries.find(x => sameEx(x.name, name)); if (!e || !e.sets.length) return null;
    const best = e.sets.reduce((b, s) => (s.kg > b.kg || (s.kg === b.kg && s.reps > b.reps)) ? s : b);
    return { date: w.date, kg: best.kg || 0, reps: best.reps || 0 };
  }).filter(Boolean);
}
function bestOf(name) { const t = topSets(name); return t.length ? t.reduce((b, s) => (s.kg > b.kg || (s.kg === b.kg && s.reps > b.reps)) ? s : b) : null; }
const weekStartIso = () => { const wd = (parse(today()).getDay() + 6) % 7; return addDays(today(), -wd); };
const minsSince = iso => Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));

function strengthChart(box, pts) {
  if (!box) return;
  if (!pts.length) { box.innerHTML = `<div class="empty">Noch keine Daten für diese Übung.</div>`; return; }
  const useReps = pts.every(p => !p.kg), val = p => useReps ? p.reps : p.kg;
  const W = Math.max(280, box.clientWidth || 320), H = 200, m = { l: 40, r: 14, t: 12, b: 26 };
  let lo = Math.min(...pts.map(val)), hi = Math.max(...pts.map(val));
  if (hi - lo < 4) { lo -= 2; hi += 2; } lo = Math.max(0, lo);
  const ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const d0 = pts[0].date, dn = Math.max(1, dayDiff(d0, pts[pts.length - 1].date));
  const xs = pts.map(p => pts.length === 1 ? W / 2 : m.l + dayDiff(d0, p.date) / dn * (W - m.l - m.r));
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${xs[i].toFixed(1)} ${Y(val(p)).toFixed(1)}`).join("");
  const n = Math.min(4, pts.length), idx = [...new Set(Array.from({ length: n }, (_, i) => Math.round(i * (pts.length - 1) / Math.max(1, n - 1))))];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kraftverlauf">
      ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${m.l - 8}" y="${Y(t) + 4}" font-size="11" fill="var(--text-3)" text-anchor="end">${fmt(t, t % 1 ? 1 : 0)}</text>`).join("")}
      <text x="${m.l - 8}" y="${m.t - 2}" font-size="11" fill="var(--text-3)" text-anchor="end"></text>
      <line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" style="display:none"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map((p, i) => `<circle cx="${xs[i]}" cy="${Y(val(p))}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
      ${idx.map((i, k) => `<text x="${xs[i]}" y="${H - 6}" font-size="11" fill="var(--text-3)" text-anchor="${idx.length > 1 && k === 0 ? "start" : idx.length > 1 && k === idx.length - 1 ? "end" : "middle"}">${short(pts[i].date)}</text>`).join("")}
    </svg><div class="small muted" style="margin-top:4px">${useReps ? "Beste Wiederholungen pro Training" : "Schwerster Satz pro Training (kg)"}</div>`;
  attachTip(box, box.querySelector("svg"), pts.map((p, i) => ({ x: xs[i], y: Y(val(p)) })), xs, i => `${short(pts[i].date)}<br><b>${fmtSet(pts[i])}</b>`);
}

          <label class="f">Name des Plans</label><input id="plName" value="${esc(editing.name)}" placeholder="z. B. Push, Pull, Beine, Oberkörper" required>
          <label class="f" style="margin-top:10px">Übungen, eine pro Zeile: Name Sätze×Wiederholungen</label>
          <textarea id="plEx" style="min-height:150px" placeholder="Bankdrücken 3x8-10&#10;Schrägbankdrücken Kurzhantel 3x10&#10;Seitheben 3x12-15&#10;Trizepsdrücken am Kabel 3x12">${esc(editing.exercises.map(e => `${e.name} ${e.sets}x${e.reps}`).join("\n"))}</textarea>
          <div class="row" style="margin-top:10px"><button type="button" class="btn ghost" id="plCancel">Abbrechen</button><button class="btn grow" type="submit">Plan speichern</button></div>
        </form>` : `<button class="btn ghost" id="newPlan" style="width:100%;margin-top:${db.plans.length ? 10 : 0}px">Neuer Plan</button>`}
    </div>

    <div class="card"><h2>KI-Coach</h2>
      <div class="small muted" style="margin-bottom:10px">Schickt deine Trainings der letzten 4 Wochen, dein Gewicht und deinen Schlaf an die KI und fragt nach Feedback.</div>
      <div class="step" style="margin-top:0"><span class="n">1</span><div class="grow"><button class="btn" id="gymAsk" style="width:100%;white-space:normal">Trainingsdaten kopieren${app.url ? ` & ${app.name} öffnen` : ""}</button></div></div>
      <div class="step"><span class="n">2</span><div class="grow"><button class="btn ghost" id="gymPaste" style="width:100%">Antwort einfügen</button>
        <textarea id="gymAns" placeholder="… oder die Antwort hier hineinkopieren" style="margin-top:8px">${esc(gymKiText)}</textarea>
        <button class="btn" id="gymNoteSave" style="width:100%;margin-top:8px" ${gymKiText.trim() ? "" : "hidden"}>Als Notiz speichern</button></div></div>
      ${db.gymNotes.length ? `<div style="margin-top:12px">${[...db.gymNotes].reverse().map(n => `<details class="note" data-gn="${n.id}"><summary><span class="grow">Feedback vom ${short(n.created)}</span></summary><div class="md">${md(n.text)}</div><button class="btn small ghost gn-del" style="margin-top:6px">Löschen</button></details>`).join("")}</div>` : ""}
    </div>`;
  bindBodyHeader();
  $("#view").querySelectorAll(".start-plan").forEach(b => b.addEventListener("click", () => startWorkout(b.dataset.id)));
  $("#startFree").addEventListener("click", () => startWorkout(null));
  const ge = $("#gymEx"); if (ge) { ge.addEventListener("change", e => { gymEx = e.target.value; strengthChart($("#gymChart"), topSets(gymEx)); }); strengthChart($("#gymChart"), topSets(gymEx)); }
  $("#view").querySelectorAll("[data-w] .w-del").forEach(b => b.addEventListener("click", () => {
    const id = b.closest("[data-w]").dataset.w; if (confirm("Training löschen?")) { db.workouts = db.workouts.filter(w => w.id !== id); save(); render(); }
  }));
  $("#view").querySelectorAll("[data-plan]").forEach(row => {
    const id = row.dataset.plan;
    row.querySelector(".p-edit").addEventListener("click", () => { editPlanId = id; render(); $("#planForm").scrollIntoView({ behavior: "smooth", block: "center" }); });
    row.querySelector(".p-del").addEventListener("click", () => { if (confirm("Plan löschen? Deine Trainings bleiben erhalten.")) { db.plans = db.plans.filter(p => p.id !== id); save(); render(); } });
  });
  const np = $("#newPlan"); if (np) np.addEventListener("click", () => { editPlanId = "new"; render(); $("#plName").focus(); });
  const pf = $("#planForm");
  if (pf) {
    $("#plCancel").addEventListener("click", () => { editPlanId = null; render(); });
    pf.addEventListener("submit", e => {
      e.preventDefault();
      const name = $("#plName").value.trim(), exercises = $("#plEx").value.split("\n").map(parseExLine).filter(Boolean);
      if (!name || !exercises.length) { toast("Bitte Name und mindestens eine Übung eintragen"); return; }
      if (editPlanId === "new") db.plans.push({ id: uid(), name, exercises });
      else Object.assign(db.plans.find(p => p.id === editPlanId), { name, exercises });
      editPlanId = null; save(); render(); toast("Plan gespeichert");
    });
  }
  $("#gymAsk").addEventListener("click", () => {
    copyText(gymPrompt()).then(ok => toast(ok ? "Trainingsdaten kopiert" : "Kopieren nicht möglich"));
    if (app.url) window.open(app.url, "_blank");
  });
  const syncBtn = () => { $("#gymNoteSave").hidden = !gymKiText.trim(); };
  $("#gymPaste").addEventListener("click", async () => {
    try { gymKiText = await navigator.clipboard.readText(); $("#gymAns").value = gymKiText; syncBtn(); }
    catch (e) { $("#gymAns").focus(); toast("Lange in das Feld tippen → Einsetzen"); }
  });
  $("#gymAns").addEventListener("input", e => { gymKiText = e.target.value; syncBtn(); });
  $("#gymNoteSave").addEventListener("click", () => { db.gymNotes.push({ id: uid(), text: gymKiText, created: today() }); gymKiText = ""; save(); render(); toast("Feedback gespeichert"); });
  $("#view").querySelectorAll("[data-gn] .gn-del").forEach(b => b.addEventListener("click", () => {
    const id = b.closest("[data-gn]").dataset.gn; if (confirm("Notiz löschen?")) { db.gymNotes = db.gymNotes.filter(n => n.id !== id); save(); render(); }
  }));
}

function renderWorkout() {
  const aw = db.activeWorkout, known = allExercises();
  $("#view").innerHTML = `
    <div class="datebar"><button class="icon-btn" id="wCancel" aria-label="Training verwerfen">✕</button>
      <div style="text-align:center"><b>${esc(aw.planName)}</b><div class="small muted" id="elapsed">${minsSince(aw.start)} min</div></div>
      <span style="width:36px"></span></div>
    ${aw.entries.map((e, ei) => {
      const last = lastSetsFor(e.name);
      return `<div class="card" data-e="${ei}">
        <div class="row"><div class="grow"><b>${esc(e.name)}</b>${e.target ? ` <span class="small muted">${e.target}</span>` : ""}
          <div class="small muted">${last ? `Letztes Mal: ${last.map(fmtSet).join(", ")}` : "Erstes Mal"}</div></div>
          <button class="icon-btn e-del" aria-label="Übung entfernen">✕</button></div>
        <div class="setgrid head"><span>Satz</span><span>kg</span><span>Wdh.</span><span></span></div>
        ${e.sets.map((s, si) => {
          const ph = last && (last[si] || last[last.length - 1]);
          return `<div class="setgrid ${s.done ? "done" : ""}" data-s="${si}"><span class="muted">${si + 1}</span>
            <input inputmode="decimal" data-f="kg" value="${esc(s.kg)}" placeholder="${ph && ph.kg ? fmtKg(ph.kg) : "–"}">
            <input inputmode="numeric" data-f="reps" value="${esc(s.reps)}" placeholder="${ph ? ph.reps : "–"}">
            <button class="check ${s.done ? "done" : ""} s-done" aria-label="Satz erledigt"></button></div>`;
        }).join("")}
        <div class="row" style="margin-top:8px"><button class="btn small ghost s-add">+ Satz</button>${e.sets.length > 1 ? `<button class="btn small ghost s-rem">− Satz</button>` : ""}</div>
      </div>`;
    }).join("")}
    <form class="card row" id="exAdd"><input id="exName" list="exList" placeholder="Übung hinzufügen …" autocomplete="off" required>
      <datalist id="exList">${known.map(x => `<option value="${esc(x)}">`).join("")}</datalist><button class="btn" type="submit">+</button></form>
    <button class="btn" id="wFinish" style="width:100%">Training beenden</button>`;

  $("#view").querySelectorAll("[data-e]").forEach(card => {
    const e = aw.entries[+card.dataset.e], last = lastSetsFor(e.name);
    card.querySelectorAll("[data-s]").forEach(row => {
      const s = e.sets[+row.dataset.s], si = +row.dataset.s;
      row.querySelectorAll("input").forEach(inp => inp.addEventListener("input", () => { s[inp.dataset.f] = inp.value; save(); }));
      row.querySelector(".s-done").addEventListener("click", () => {
        s.done = !s.done;
        if (s.done) {
          const ph = last && (last[si] || last[last.length - 1]);
          if (s.kg === "" && ph && ph.kg) s.kg = fmtKg(ph.kg);
          if (s.reps === "" && ph) s.reps = String(ph.reps);
          restUntil = Date.now() + (db.settings.restSec || 90) * 1000; restDoneAt = 0; tickRest();
        }
        save(); render();
      });
    });
    card.querySelector(".s-add").addEventListener("click", () => { e.sets.push({ kg: e.sets.length ? e.sets[e.sets.length - 1].kg : "", reps: "", done: false }); save(); render(); });
    const rem = card.querySelector(".s-rem"); if (rem) rem.addEventListener("click", () => { e.sets.pop(); save(); render(); });
    card.querySelector(".e-del").addEventListener("click", () => { if (confirm(`${e.name} entfernen?`)) { aw.entries.splice(+card.dataset.e, 1); save(); render(); } });
  });
  $("#exAdd").addEventListener("submit", ev => {
    ev.preventDefault(); const n = $("#exName").value.trim(); if (!n) return;
    const name = known.find(x => sameEx(x, n)) || n, last = lastSetsFor(name);
    aw.entries.push({ name, target: "", sets: Array.from({ length: last ? last.length : 3 }, () => ({ kg: "", reps: "", done: false })) });
    save(); render(); window.scrollTo(0, document.body.scrollHeight);
  });
  $("#wCancel").addEventListener("click", () => { if (confirm("Training verwerfen? Die Eingaben gehen verloren.")) { db.activeWorkout = null; restUntil = 0; tickRest(); save(); render(); } });
  $("#wFinish").addEventListener("click", finishWorkout);
}
function finishWorkout() {
  const aw = db.activeWorkout;
  const entries = aw.entries.map(e => ({
    name: e.name,
    sets: e.sets.map(s => ({ kg: Math.max(0, num(s.kg) || 0), reps: Math.max(0, Math.round(num(s.reps) || 0)) })).filter(s => s.reps > 0),
  })).filter(e => e.sets.length);
  if (!entries.length) { if (confirm("Keine Sätze mit Wiederholungen eingetragen. Training verwerfen?")) { db.activeWorkout = null; save(); render(); } return; }
  const prs = entries.map(e => { const b = bestOf(e.name), top = Math.max(...e.sets.map(s => s.kg)); return b && top > b.kg ? `${e.name} ${fmtKg(top)} kg` : null; }).filter(Boolean);
  db.workouts.push({ id: aw.id, date: aw.date, start: aw.start, durationMin: minsSince(aw.start), planId: aw.planId, planName: aw.planName, entries });
  db.activeWorkout = null; restUntil = 0; tickRest(); save(); render(); window.scrollTo(0, 0);
  toast(prs.length ? `Neue Bestleistung: ${prs[0]}` : "Training gespeichert");
}
// Pausentimer und Trainingsdauer
function tickRest() {
  const bar = $("#restBar"), left = Math.ceil((restUntil - Date.now()) / 1000);
  document.body.classList.toggle("resting", !!restUntil);
  if (restUntil && left > 0) { bar.hidden = false; bar.querySelector("b").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; bar.querySelector("span").textContent = "Pause"; }
  else if (restUntil && left <= 0) { if (!restDoneAt) restDoneAt = Date.now(); bar.querySelector("span").textContent = "Pause vorbei"; bar.querySelector("b").textContent = "Los!"; if (Date.now() - restDoneAt > 4000) { restUntil = 0; bar.hidden = true; document.body.classList.remove("resting"); } }
  else bar.hidden = true;
  const el = $("#elapsed"); if (el && db.activeWorkout) el.textContent = `${minsSince(db.activeWorkout.start)} min`;
}
setInterval(tickRest, 1000);

/* ---------- Mehr ---------- */
function renderMore() {
  const s = db.settings;
  $("#view").innerHTML = `
    <h1>Mehr</h1><p class="sub">Konto, Ziele, KI und Backup.</p>
    <div class="card"><h2>Konto</h2>
      ${loggedIn() ? `<div class="row"><div class="grow"><div>${esc(session.user.email)}</div><div class="small muted" id="syncState">${syncLabel()}</div></div></div>
        <div class="row" style="margin-top:12px"><button class="btn ghost grow" id="syncNow">Synchronisieren</button><button class="btn ghost grow" id="logout">Abmelden</button></div>`
      : cloudOn ? "" : `<div class="small muted">Noch kein Konto eingerichtet. Deine Daten liegen nur auf diesem Gerät. Für Anmeldung und Sync trägst du deine Supabase-Daten in <b>config.js</b> ein.</div>`}
    </div>
    <form class="card" id="setForm"><h2>Ziele</h2>
      <div class="row">
        <div class="grow"><label class="f">Zielgewicht (kg)</label><input id="gW" inputmode="decimal" placeholder="optional" value="${s.goalWeight ? fmt(s.goalWeight) : ""}"></div>
        <div class="grow"><label class="f">Schlafziel (Stunden)</label><input id="gS" inputmode="decimal" value="${fmt(s.sleepGoal, s.sleepGoal % 1 ? 1 : 0)}"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f">Kalorien pro Tag (kcal)</label><input id="gK" inputmode="numeric" placeholder="optional" value="${s.kcalGoal || ""}"></div>
        <div class="grow"><label class="f">Protein (g)</label><input id="gP" inputmode="numeric" placeholder="optional" value="${s.proteinGoal || ""}"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label class="f">Kohlenhydrate (g)</label><input id="gC" inputmode="numeric" placeholder="optional" value="${s.carbGoal || ""}"></div>
        <div class="grow"><label class="f">Fett (g)</label><input id="gF" inputmode="numeric" placeholder="optional" value="${s.fatGoal || ""}"></div>
      </div>
      <div style="margin-top:10px"><label class="f">Pause zwischen Sätzen (Sekunden)</label><input id="gR" inputmode="numeric" value="${s.restSec || 90}"></div>
      <div class="row" style="margin-top:12px"><button class="btn grow" type="submit">Ziele speichern</button></div>
    </form>
    <div class="card"><h2>Schule</h2>
      <label class="f">Klasse und Schulart (hilft der KI, passend zu erklären)</label>
      <input id="grade" placeholder="z. B. Klasse 11, Gymnasium" value="${esc(s.grade || "")}">
    </div>
    <div class="card"><h2>KI-App</h2>
      <label class="f">Welche KI-App soll der KI-Knopf öffnen?</label>
      <select id="aiApp">${Object.entries(AI_APPS).map(([k, a]) => `<option value="${k}" ${s.aiApp === k ? "selected" : ""}>${a.name === "nur kopieren" ? "Keine öffnen, nur kopieren" : a.name}</option>`).join("")}</select>
      <p class="small muted" style="margin-bottom:0">Die App kopiert die Anfrage in die Zwischenablage. Ist die KI-App installiert, öffnet sie sich meist direkt, sonst die Webseite. Achte auf die Altersgrenze der KI-App.</p>
    </div>
    <div class="card"><h2>Backup</h2>
      <p class="small muted" style="margin-top:0">${loggedIn() ? "Deine Daten liegen in deinem Konto. Ein zusätzliches Backup schadet trotzdem nicht." : "Deine Daten liegen nur auf diesem Gerät. Sichere sie ab und zu, z. B. in der Dateien-App oder iCloud."}</p>
      <div class="row wrap">
        <button class="btn ghost grow" id="exp">Backup sichern</button>
        <button class="btn ghost grow" id="impBtn">Backup laden</button>
        <input type="file" id="imp" accept="application/json,.json" hidden>
      </div>
      <p class="small muted" style="margin-bottom:0">${db.todos.length} Todos · ${db.weights.length} Gewichtseinträge · ${db.sleep.length} Schlafeinträge · ${db.meals.length} Mahlzeiten · ${db.favorites.length} Favoriten · ${db.cards.length} Karteikarten · ${db.notes.length} Notizen · ${db.workouts.length} Trainings</p>
      <p class="small muted" style="margin-bottom:0">Schuldateien sind nicht in dieser Backup-Datei${loggedIn() ? ", sie liegen aber in deinem Konto" : ""}.</p>
    </div>
    `;
  const sn = $("#syncNow"); if (sn) sn.addEventListener("click", () => sync().then(() => toast(syncState === "ok" ? "Synchronisiert" : "Sync gerade nicht möglich")));
  const lo = $("#logout"); if (lo) lo.addEventListener("click", logout);
  $("#setForm").addEventListener("submit", e => {
    e.preventDefault();
    const g = num($("#gW").value), sg = num($("#gS").value);
    s.goalWeight = g && g > 20 ? Math.round(g * 10) / 10 : null;
    s.sleepGoal = sg && sg > 0 && sg < 16 ? sg : 8;
    const pos = id => { const v = num($(id).value); return v && v > 0 ? Math.round(v) : null; };
    s.restSec = pos("#gR") || 90; s.kcalGoal = pos("#gK"); s.proteinGoal = pos("#gP"); s.carbGoal = pos("#gC"); s.fatGoal = pos("#gF");
    save(); toast("Ziele gespeichert");
  });
  $("#grade").addEventListener("change", e => { s.grade = e.target.value.trim(); save(); toast("Gespeichert"); });
  $("#aiApp").addEventListener("change", e => { s.aiApp = e.target.value; save(); toast("Gespeichert"); });
  $("#exp").addEventListener("click", async () => {
    const name = `tagwerk-backup-${today()}.json`;
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $("#impBtn").addEventListener("click", () => $("#imp").click());
  $("#imp").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.todos) || !Array.isArray(d.weights) || !Array.isArray(d.sleep)) throw 0;
      if (!confirm("Backup laden? Die aktuellen Daten werden ersetzt.")) return;
      db = Object.assign(blank(), d, { settings: Object.assign(blank().settings, d.settings || {}) });
      save(); render(); toast("Backup geladen");
    } catch (err) { toast("Das ist keine gültige Backup-Datei"); }
  });
}

/* ---------- Start ---------- */
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
if (loggedIn()) sync();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
